[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchify"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["python-dotenv", "supabase", "keyring", "rich"]

[project.scripts]
searchify = "searchify.__main__:main"

[tool.setuptools.packages.find]
include = ["searchify*"]
namespaces = true

[tool.setuptools.package-data]
"searchify.ui" = ["*.ansi"]
