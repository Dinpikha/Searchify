name: Searchify CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run offline regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: CLI smoke tests
        run: |
          searchify help
          searchify doctor --offline
          searchify status --no-scan --offline
          searchify sync --dry-run

      - name: Validate package build
        run: |
          pip install build setuptools wheel
          python -m build --wheel

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff

      - name: Run ruff on source code
        run: ruff check searchify/ --output-format=github

      - name: Check formatting on source code
        run: ruff format --check searchify/

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true